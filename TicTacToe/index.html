<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="msg-container hide" role="dialog" aria-modal="true" aria-labelledby="msg">
      <div class="msg-card">
        <p id="msg">Winner</p>
        <button id="new">New Game</button>
      </div>
    </div>
    <main>
      <h1>Tic Tac Toe</h1>
      <p id="status" aria-live="polite">X's turn</p>
      <div class="score">
        <span class="x">X <b id="scoreX">0</b></span>
        <span>Draws <b id="scoreD">0</b></span>
        <span class="o">O <b id="scoreO">0</b></span>
      </div>
      <div class="container">
        <div class="game">
          <button class="box" aria-label="Cell 1, empty"></button>
          <button class="box" aria-label="Cell 2, empty"></button>
          <button class="box" aria-label="Cell 3, empty"></button>
          <button class="box" aria-label="Cell 4, empty"></button>
          <button class="box" aria-label="Cell 5, empty"></button>
          <button class="box" aria-label="Cell 6, empty"></button>
          <button class="box" aria-label="Cell 7, empty"></button>
          <button class="box" aria-label="Cell 8, empty"></button>
          <button class="box" aria-label="Cell 9, empty"></button>
        </div>
      </div>
      <button id="reset">Reset</button>
    </main>
    <script src="game.js"></script>
  </body>
</html>
